manifestVersion: 1.1
id: homelab-shelfmark
category: media
name: Shelfmark
version: "1.3.15"
tagline: Search and download books and audiobooks
icon: https://raw.githubusercontent.com/calibrain/shelfmark/main/src/frontend/public/logo.png
description: >-
  Shelfmark (formerly Calibre-Web-Automated-Book-Downloader) is a self-hosted web app
  for searching and downloading books and audiobooks. It can search directly over HTTP,
  or search your Prowlarr indexers and send torrents to Transmission.


  This build is pre-wired to your other Umbrel apps. It talks to Prowlarr and
  Transmission over the internal Umbrel network, shares Transmission's Downloads
  folder so finished torrents are visible, and writes completed books into
  Calibre-Web NextGen's ingest folder so they are imported into your library
  automatically. It also signs you in with your Calibre-Web NextGen account rather
  than a separate set of credentials.


  🛠️ AFTER INSTALLING

  Open Shelfmark and go to Settings to paste in your Prowlarr API key (find it in
  Prowlarr under Settings > General > Security). The Prowlarr and Transmission URLs
  are already filled in.


  Shelfmark has no login of its own — it signs you in with your Calibre-Web NextGen
  account, so use admin / admin123 unless you have already changed that password.
developer: calibrain
website: https://github.com/calibrain/shelfmark
dependencies:
  - homelab-calibre-web-nextgen
  - prowlarr
  - transmission
repo: https://github.com/calibrain/shelfmark
support: https://github.com/calibrain/shelfmark/issues
port: 8084
gallery:
  - https://raw.githubusercontent.com/calibrain/shelfmark/main/README_images/homescreen.png
  - https://raw.githubusercontent.com/calibrain/shelfmark/main/README_images/search-results.png
  - https://raw.githubusercontent.com/calibrain/shelfmark/main/README_images/downloads.png
  - https://raw.githubusercontent.com/calibrain/shelfmark/main/README_images/multi-source.png
path: ""
defaultUsername: "Your Calibre-Web NextGen username"
defaultPassword: "Your Calibre-Web NextGen password"
releaseNotes: ""
permissions:
  - STORAGE_DOWNLOADS
submitter: mark-fzks
submission: https://github.com/mark-fzks/umbrel-shelfmark-store
