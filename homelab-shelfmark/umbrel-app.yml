manifestVersion: 1.1
id: homelab-shelfmark
category: media
name: Shelfmark
version: "1.3.15"
tagline: Search and download books and audiobooks
description: >-
  Shelfmark (formerly Calibre-Web-Automated-Book-Downloader) is a self-hosted web app
  for searching and downloading books and audiobooks. It can search directly over HTTP,
  or search your Prowlarr indexers and send torrents/NZBs to a download client like
  Transmission.


  This app is pre-wired to talk to your Prowlarr and Transmission installs over the
  internal Umbrel network, and shares the same Downloads folder as Transmission so
  finished torrents can be imported automatically.


  🛠️ AFTER INSTALLING

  Open Shelfmark and go to Settings to paste in your Prowlarr API key (find it in
  Prowlarr under Settings > General > Security), and confirm the Transmission
  connection under Settings > Download Clients.
developer: calibrain
website: https://github.com/calibrain/shelfmark
dependencies:
  - prowlarr
  - transmission
repo: https://github.com/calibrain/shelfmark
support: https://github.com/calibrain/shelfmark/issues
port: 8084
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: ""
permissions:
  - STORAGE_DOWNLOADS
submitter: ""
submission: ""
